<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangGraph Chatbot Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Conversation history">
        <div class="sidebar-header">
          <div>
            <p class="eyebrow">LANGGRAPH LAB</p>
            <h1>Chats</h1>
          </div>
          <button id="new-chat" class="icon-button" type="button" title="New conversation" aria-label="New conversation">+</button>
        </div>
        <div id="conversation-list" class="conversation-list" aria-live="polite"></div>
      </aside>
      <section class="chat-layout" aria-label="Chat conversation">
        <header class="chat-header">
          <div>
            <p class="eyebrow">CONVERSATION</p>
            <h2 id="conversation-title">New conversation</h2>
          </div>
          <span class="status"><i></i> Ready</span>
        </header>
        <div id="messages" class="messages">
          <article class="message assistant"><span class="avatar">AI</span><div><small>LangGraph assistant</small><p>Hello. Ask me anything to test the chatbot workflow.</p></div></article>
        </div>
        <form id="chat-form">
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="1" placeholder="Ask something..." required></textarea>
          <button type="submit">Send <span>↗</span></button>
        </form>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
